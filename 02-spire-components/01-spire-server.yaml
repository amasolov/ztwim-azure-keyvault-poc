# SPIRE Server: issues and manages SPIFFE identities (SVIDs).
#
# IMPORTANT: jwtKeyType MUST be rsa-2048 (or rsa-4096) for Azure Entra ID
# federation. Entra ID only supports RS256-signed tokens; SPIRE defaults to
# ES256 which Azure will reject.
#
# >>> Replace <your-apps-domain> with your cluster's apps domain <<<
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
spec:
  jwtIssuer: "https://oidc-discovery.<your-apps-domain>"
  # RS256 is required for Azure Entra ID federation
  jwtKeyType: rsa-2048
  caSubject:
    commonName: "SPIRE CA"
    country: "US"
    organization: "ZTWIM POC"
  datastore:
    databaseType: sqlite3
    connectionString: "/run/spire/data/datastore.sqlite3"
  persistence:
    size: "1Gi"
    accessMode: ReadWriteOnce
