# SPIRE Server: issues and manages SPIFFE identities (SVIDs).
#
# IMPORTANT: jwtKeyType MUST be rsa-2048 (or rsa-4096) for Azure Entra ID
# federation. Entra ID only supports RS256-signed tokens; SPIRE defaults to
# ES256 which Azure will reject.
#
# Set trustDomain to match your cluster's apps domain so the auto-generated
# OIDC route hostname is correct.
#
# >>> Replace <your-cluster-domain> with your actual cluster domain <<<
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
spec:
  # Must match your cluster's base apps domain.
  trustDomain: "apps.<your-cluster-domain>"
  clusterName: "<your-cluster-name>"
  jwtIssuer: "https://oidc-discovery.apps.<your-cluster-domain>"
  # RS256 is required for Azure Entra ID federation
  jwtKeyType: rsa-2048
  caBundleConfigMap: spire-bundle
  replicas: 1
  controllerManager:
    # Automatically register workloads via ClusterSPIFFEID CRDs
    enabled: true
    ignoreNamespaces:
      - kube-system
      - kube-public
      - openshift-*
      - zero-trust-workload-identity-manager
